  <script>
    // Direct Download Map (Hidden from link hover status bar)
    const DOWNLOAD_MAP = {
      'win-setup': 'https://github.com/anandnowhere/stratexa-releases/releases/download/v1.0.23/Personal-Reminder-Assistant-Setup-1.0.23.exe',
      'win-portable': 'https://github.com/anandnowhere/stratexa-releases/releases/download/v1.0.23/Personal-Reminder-Assistant-Portable-1.0.23.exe',
      'mac-dmg': 'https://github.com/anandnowhere/stratexa-releases/releases/download/v1.0.23/Personal-Reminder-Assistant-1.0.23-mac.dmg',
      'mac-zip': 'https://github.com/anandnowhere/stratexa-releases/releases/download/v1.0.23/Personal-Reminder-Assistant-1.0.23-mac.zip',
      'linux-appimage': 'https://github.com/anandnowhere/stratexa-releases/releases/download/v1.0.23/Personal-Reminder-Assistant-1.0.23.AppImage',
      'linux-deb': 'https://github.com/anandnowhere/stratexa-releases/releases/download/v1.0.23/Personal-Reminder-Assistant-1.0.23.deb'
    };

    const NAMES_MAP = {
      'win-setup': 'Windows Setup Installer (.exe)',
      'win-portable': 'Windows Office & Corporate Portable (.exe)',
      'mac-dmg': 'macOS Universal DMG (.dmg)',
      'mac-zip': 'macOS Universal ZIP (.zip)',
      'linux-appimage': 'Linux Standalone (.AppImage)',
      'linux-deb': 'Linux Debian Package (.deb)'
    };

    function triggerPauzosDownload(key) {
      const url = DOWNLOAD_MAP[key];
      if (!url) return;

      showDownloadToast(NAMES_MAP[key] || 'Pauzos App');

      // Trigger download seamlessly without exposing GitHub on link hover
      const iframe = document.createElement('iframe');
      iframe.style.display = 'none';
      iframe.src = url;
      document.body.appendChild(iframe);
      setTimeout(() => { iframe.remove(); }, 60000);
    }

    function showDownloadToast(fileName) {
      const toast = document.getElementById('dlNotification');
      const desc = document.getElementById('dlNotifDesc');
      if (toast && desc) {
        desc.textContent = `Downloading ${fileName}...`;
        toast.style.display = 'flex';
        setTimeout(() => { toast.style.display = 'none'; }, 6000);
      }
    }

    // Automatic OS detection & highlighting
    document.addEventListener('DOMContentLoaded', () => {
      const urlParams = new URLSearchParams(window.location.search);
      let os = urlParams.get('os');

      if (!os) {
        const platform = navigator.userAgent.toLowerCase();
        if (platform.includes('win')) os = 'windows';
        else if (platform.includes('mac')) os = 'mac';
        else if (platform.includes('linux')) os = 'linux';
      }

      // If Windows, prioritize the Office Portable edition
      if (os === 'windows' || os === 'portable') {
        const targetCard = document.getElementById('card-windows-portable');
        if (targetCard) targetCard.classList.add('recommended');
      } else if (os === 'mac') {
        const targetCard = document.getElementById('card-mac');
        if (targetCard) targetCard.classList.add('recommended');
      } else if (os === 'linux') {
        const targetCard = document.getElementById('card-linux');
        if (targetCard) targetCard.classList.add('recommended');
      }
    });
  </script>
